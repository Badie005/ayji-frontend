<!-- login.component.html - Dark Mode Redesign -->
<div class="login-container">

  <div class="left-column">
    <img src="login-image-1.jpg" alt="Image décorative" loading="lazy">
  </div>

  <div class="right-column">
    <div class="login-wrapper">
      <div class="form-container">
        <div class="form-header">
          <div class="logo-container">
            <img src="logo-image.png" alt="logo-image" class="logo-image" loading="lazy">   
          </div>
          <h1 class="Connexion">Log in</h1>
          <p>or <a [routerLink]="['/signup']" class="create-account-link">Create an account</a></p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <!-- Alert messages -->
          <div *ngIf="successMessage" class="alert-success" role="alert">
            <span class="alert-icon">✓</span>
            {{ successMessage }}
            <button type="button" class="close-alert" aria-label="Close" (click)="successMessage = ''">×</button>
          </div>
          
          <div *ngIf="errorMessage" class="alert-error" role="alert">
            <span class="alert-icon">!</span>
            {{ errorMessage }}
            <button type="button" class="close-alert" aria-label="Fermer" (click)="errorMessage = ''"></button>
          </div>

          <!-- Email or username -->
          <div class="form-group">
            <input
              type="text"
              id="email"
              formControlName="email"
              autocomplete="email"
              [ngClass]="{'is-invalid': submitted && formErrors.email}"
              aria-describedby="email-error"
              placeholder=" "
            >
            <label for="email">Email or username<span class="required-mark"></span></label>
            <div *ngIf="submitted && formErrors.email" class="invalid-feedback" id="email-error">
              {{ formErrors.email }}
            </div>
          </div>

          <!-- Password -->
          <div class="form-group password-container">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              autocomplete="current-password"
              [ngClass]="{'is-invalid': submitted && formErrors.password}"
              aria-describedby="password-error"
              placeholder=" "
            >
            <label for="password">Password<span class="required-mark"></span></label>
            <button 
              type="button" 
              class="toggle-password" 
              (click)="togglePasswordVisibility()" 
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              [attr.aria-pressed]="showPassword"
            >
              <!-- Afficher l'œil barré quand le mot de passe est caché (par défaut) -->
              <svg *ngIf="!showPassword" class="eye-icon" focusable="false" viewBox="0 0 18 15">
                <path d="M13.794,14.576-.424.364.364-.424,14.583,13.788Z" transform="translate(1.922 0.424)" fill="currentColor"></path>
                <g transform="translate(-1.314 -3.076)">
                  <g>
                    <path d="M17.164,14.777l-.627-.922a8.932,8.932,0,0,0,2.684-2.88,9.164,9.164,0,0,0-7.731-4.462h-.008a7.379,7.379,0,0,0-2.333.311L8.827,5.757A8.492,8.492,0,0,1,11.508,5.4a10.28,10.28,0,0,1,8.841,5.3l.146.265-.143.267A10.046,10.046,0,0,1,17.164,14.777Z" transform="translate(-1.182 -0.397)" fill="currentColor"></path>
                    <path d="M10.315,16.732h-.008a10.28,10.28,0,0,1-8.845-5.3l-.149-.271.151-.27a10.638,10.638,0,0,1,4.5-4.322l.5.994a9.524,9.524,0,0,0-3.874,3.6,9.164,9.164,0,0,0,7.721,4.457,9.592,9.592,0,0,0,3.867-.869l.463,1.014a10.7,10.7,0,0,1-4.322.97Z" transform="translate(0 -0.583)" fill="currentColor"></path>
                  </g>
                </g>
                <path d="M15.065,11.485l-1.114-.039a1.867,1.867,0,0,0-1.932-1.931L11.979,8.4a2.982,2.982,0,0,1,3.086,3.085Z" transform="translate(-2.997 -3.965)" fill="currentColor"></path>
                <path d="M11.382,14.691A2.982,2.982,0,0,1,8.4,11.623a2.807,2.807,0,0,1,.939-2.17l.743.831a1.7,1.7,0,0,0-.567,1.322v.037a1.867,1.867,0,0,0,1.932,1.931h.037a1.7,1.7,0,0,0,1.323-.567l.832.743a2.81,2.81,0,0,1-2.171.939Z" transform="translate(-2.465 -4.124)" fill="currentColor"></path>
              </svg>
              
              <!-- Afficher l'œil normal quand le mot de passe est visible -->
              <svg *ngIf="showPassword" class="eye-icon" focusable="false" viewBox="0 0 18 11">
                <g transform="translate(-1.258 -5.35)">
                  <path d="M10.258,5.35h.007a10.283,10.283,0,0,1,8.848,5.309l.145.263-.145.263a10.283,10.283,0,0,1-8.848,5.309H10.25A10.283,10.283,0,0,1,1.4,11.184l-.145-.263.145-.263A10.283,10.283,0,0,1,10.25,5.35Zm7.751,5.572a9.193,9.193,0,0,0-7.751-4.482,9.193,9.193,0,0,0-7.751,4.482A9.193,9.193,0,0,0,10.258,15.4,9.193,9.193,0,0,0,18.008,10.921Z" fill="currentColor"></path>
                  <path d="M2.408-.65A3.058,3.058,0,1,1-.65,2.408,3.062,3.062,0,0,1,2.408-.65Zm0,5.027A1.969,1.969,0,1,0,.439,2.408,1.971,1.971,0,0,0,2.408,4.377Z" transform="translate(7.85 8.513)" fill="currentColor"></path>
                </g>
              </svg>
            </button>
            <div *ngIf="submitted && formErrors.password" class="invalid-feedback" id="password-error">
              {{ formErrors.password }}
            </div>
          </div>

          <!-- Submit button -->
          <button 
            type="submit" 
            [disabled]="loading" 
            class="submit-button"
            [ngClass]="{'loading': loading}"
          >
            <span *ngIf="loading" class="spinner-border" role="status" aria-hidden="true"></span>
            <span class="button-text">{{ loading ? 'Loading...' : 'Enter' }}</span>
          </button>

          <!-- Forgot password link -->
          <div class="forgot-password-container">
            <a [routerLink]="['/forgot-password']" class="forgot-password">Forgot password?</a>
          </div>
        </form>
      </div>
    </div>

    <div class="footer">
      <a [routerLink]="['/legal/cgu']" class="footer-link">Conditions d'utilisation</a>
      <a [routerLink]="['/legal/privacy-policy']" class="footer-link">Politique de confidentialité</a>
    </div>
  </div>
</div>
