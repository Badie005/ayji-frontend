<!-- login.component.html -->
<div class="login-container">
  <div class="left-side">
    <div class="blob-container">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="speckles"></div>
    </div>
  </div>

  <div class="right-side">
    <div class="logo">
      <!-- Logo SVG or image here -->
    </div>

    <h1>Connexion</h1>
    <p>Entrez vos identifiants pour vous connecter</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Message d'erreur global -->
      <div *ngIf="errorMessage" class="alert-error">
        {{ errorMessage }}
      </div>

      <!-- Email -->
      <div class="form-group">
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Email"
          [ngClass]="{'is-invalid': submitted && f['email'].errors}"
        >
        <label for="email">Email*</label>
        <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
          <span *ngIf="f['email'].errors?.['required']">L'email est obligatoire</span>
          <span *ngIf="f['email'].errors?.['email']">Veuillez entrer une adresse email valide</span>
        </div>
      </div>

      <!-- Mot de passe -->
      <div class="form-group">
        <div class="password-group">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            placeholder="Mot de passe"
            [ngClass]="{'is-invalid': submitted && f['password'].errors}"
          >
          <span class="toggle-password" (click)="togglePasswordVisibility()">
            👁️
          </span>
        </div>
        <label for="password">Mot de passe*</label>
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
          <span *ngIf="f['password'].errors?.['required']">Le mot de passe est obligatoire</span>
        </div>
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-container">
          <input type="checkbox" formControlName="rememberMe">
          <span class="checkmark"></span>
          Se souvenir de moi
        </label>
        <a class="forgot-password" [routerLink]="['/forgot-password']">Mot de passe oublié ?</a>
      </div>

      <!-- Bouton de soumission -->
      <button type="submit" [disabled]="loading">
        <span *ngIf="loading">Chargement...</span>
        <span *ngIf="!loading">Se connecter</span>
      </button>

      <div class="register-redirect">
        <span>Pas encore de compte ?</span>
        <a [routerLink]="['/signup']">Créer un compte</a>
      </div>
    </form>
  </div>
</div>
