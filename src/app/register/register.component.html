<!-- register.component.html -->
<div class="login-container">
  <div class="login-form-container">
    <div class="login-header">
      <h2>Connexion</h2>
      <p>Entrez vos identifiants pour vous connecter</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Message d'erreur global -->
      <div *ngIf="errorMessage" class="alert-error">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="email">Email*</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="Entrez votre adresse email"
          [ngClass]="{'invalid': submitted && f['email'].errors}"
        >
        <div *ngIf="submitted && f['email'].errors" class="error-message">
          <span *ngIf="f['email'].errors?.['required']">L'email est obligatoire</span>
          <span *ngIf="f['email'].errors?.['email']">Veuillez entrer une adresse email valide</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe*</label>
        <div class="password-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            placeholder="Entrez votre mot de passe"
            [ngClass]="{'invalid': submitted && f['password'].errors}"
          >
          <span class="password-toggle" (click)="togglePasswordVisibility()">
            <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </span>
        </div>
        <div *ngIf="submitted && f['password'].errors" class="error-message">
          <span *ngIf="f['password'].errors?.['required']">Le mot de passe est obligatoire</span>
        </div>
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-container">
          <input type="checkbox" formControlName="rememberMe">
          <span class="checkmark"></span>
          Se souvenir de moi
        </label>
        <a class="forgot-password" [routerLink]="['/forgot-password']">Mot de passe oublié ?</a>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit" [disabled]="loading">
          <span *ngIf="loading" class="spinner"></span>
          <span *ngIf="!loading">Se connecter</span>
        </button>
      </div>

      <div class="register-redirect">
        <span>Pas encore de compte ?</span>
        <a [routerLink]="['/register']">Créer un compte</a>
      </div>
    </form>
  </div>
</div>
